# K线长跑补录 — 用 Actions 兜底 (Codespaces 不可用时)
# 每 6 小时跑一轮, 每轮最多 5.5 小时, 断点续传
# 目标: 覆盖率 74.8% → 99%+ (缺口 1346 只, 腾讯接口实测 96.9% 可达)
#
# 2026-10-15 重写。原版本有三个致命问题导致它从未真正工作过:
#   1. `workflow_dispatch: {}` 后跟 `inputs:` 缩进块, YAML 解析直接报错,
#      整个 workflow 作废 — 上线后 10 次运行全部 failure, cron 从未触发。
#   2. universe.csv 和 _progress.json 从未 checkout, load_universe() 返回
#      空列表, todo=0, 脚本打印「已全覆盖 ✅」后退出 — 假阳性, 看着像成功。
#   3. 写回目标是分片仓 day_qfq/ (只有 238 只的桶), 且 cp -n 不覆盖已有
#      文件 — 即使前两条修好, 数据也写不进去。
#
# 现在: 脚本从本仓取, 数据直接读写 stocks-data-kline 主仓, 不经分片中转。
name: kline-longrun
on:
  schedule:
    - cron: '0 2,8,14,20 * * *'   # 每天4轮 (UTC 10/16/22/02 CST)
  workflow_dispatch:
    inputs:
      max_hours:
        description: '本轮最长运行小时数'
        default: '5'
        required: false
permissions:
  contents: write
concurrency:
  # 相邻两轮间隔 6h, 单轮上限 5.5h, 理论有 0.5h 重叠窗口。
  # 不取消在跑的: 长跑任务被顶掉会丢一整轮进度。
  group: kline-longrun
  cancel-in-progress: false
jobs:
  longrun:
    runs-on: ubuntu-latest
    timeout-minutes: 355      # Actions 上限 6h, 留 5 分钟余量
    env:
      TZ: Asia/Shanghai
      STOCKS_KLINE_BULK: ${{ github.workspace }}/kline-repo/data/bulk
      STOCKS_UNIVERSE_JSON: ${{ github.workspace }}/universe-repo/data/symbols/all_symbols.json
      MAX_HOURS: ${{ github.event.inputs.max_hours || '5' }}
    steps:
      # 本仓: 提供 scripts/longrun_collect.py
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      # 主仓: 历史分片 + progress + 本轮采集结果
      - uses: actions/checkout@v4
        with:
          repository: qwerzxcva/stocks-data-kline
          token: ${{ secrets.GH_TOKEN }}
          path: kline-repo
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: jiegengxiangjianxue1/stocks
          token: ${{ secrets.GH_TOKEN }}
          path: universe-repo
          fetch-depth: 0
          sparse-checkout: data/symbols/all_symbols.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collector offline regression tests
        run: python3 -m unittest discover -s scripts -p test_longrun_collect.py -v

      - name: Validate budget and record historical universe provenance
        run: |
          set -euo pipefail
          python3 -c 'import math, os; h = float(os.environ["MAX_HOURS"]); assert math.isfinite(h) and 0 < h <= 5.5, "max_hours must be positive and <= 5.5"'
          echo "universe source: jiegengxiangjianxue1/stocks:data/symbols/all_symbols.json"
          git -C universe-repo rev-parse HEAD
          sha256sum "$STOCKS_UNIVERSE_JSON"
          source_date=$(git -C universe-repo log -1 --format=%cI -- data/symbols/all_symbols.json)
          test -n "$source_date"
          echo "historical universe source date: $source_date (not current full market)"
          echo "STOCKS_UNIVERSE_DATE=$source_date" >> "$GITHUB_ENV"

      - name: Longrun kline collect (resumable)
        run: |
          python3 scripts/longrun_collect.py kline --max-hours "$MAX_HOURS"

      - name: Report coverage
        if: always()
        run: |
          python3 scripts/longrun_collect.py coverage

      # 仅提交本轮唯一分片；正常 rebase 保留远端修改，冲突或推送失败显红。
      - name: Commit & push new klines
        if: always()
        run: |
          set -euo pipefail
          artifact="data/bulk/day_qfq_longrun_${GITHUB_RUN_ID}.csv.gz"
          if [ -f "kline-repo/$artifact" ]; then
            cd kline-repo
            git config user.name "longrun-bot"
            git config user.email "741059079@qq.com"
            git add -- "$artifact"
            if [ -f data/bulk/_longrun_progress.json ]; then
              git add -- data/bulk/_longrun_progress.json
            fi
            if ! git diff --cached --quiet HEAD; then
              ts=$(TZ=Asia/Shanghai date '+%Y%m%d_%H%M')
              git commit -m "kline-longrun: $ts"
              git fetch origin main
              git rebase origin/main
              git -c http.version=HTTP/1.1 push origin HEAD:main
            fi
          else
            echo "no new kline artifact; collection/coverage step status is preserved"
          fi

      - name: Summary
        run: |
          {
            echo "## kline-longrun $(TZ=Asia/Shanghai date '+%H:%M:%S')"
            echo "- Coverage is limited to the dated historical universe; not current full-market coverage."
            artifact="$STOCKS_KLINE_BULK/day_qfq_longrun_${GITHUB_RUN_ID}.csv.gz"
            if [ -f "$artifact" ]; then
              echo "- New raw-price rows: $(gzip -cd "$artifact" | wc -l)"
            else
              echo "- No new kline artifact. See collection and coverage status."
            fi
          } >> $GITHUB_STEP_SUMMARY
